<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    h2 {
      margin-top: 0;
      color: #333;
      font-size: 18px;
    }
    p {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }
    .status {
      padding: 8px 12px;
      background-color: #f0f0f0;
      border-radius: 4px;
      font-size: 13px;
      margin-top: 12px;
    }
    .active {
      background-color: #e8f5e9;
      color: #2e7d32;
    }
    .debug-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e0e0e0;
    }
    .debug-btn {
      background: #f44336;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      margin-top: 8px;
      width: 100%;
    }
    .debug-btn:hover {
      background: #d32f2f;
    }
    .debug-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .domains-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e0e0e0;
    }
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }
    .add-domain-btn {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      width: 100%;
    }
    .add-domain-btn:hover {
      background: #45a049;
    }
    .add-domain-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .domain-list {
      margin-top: 12px;
    }
    .domain-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      background: #f5f5f5;
      border-radius: 4px;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .domain-name {
      color: #333;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .domain-badge {
      font-size: 10px;
      color: #666;
      background: #e0e0e0;
      padding: 2px 6px;
      border-radius: 3px;
      margin-left: 6px;
    }
    .remove-btn {
      background: #f44336;
      color: white;
      border: none;
      padding: 3px 8px;
      border-radius: 3px;
      font-size: 10px;
      cursor: pointer;
      margin-left: 8px;
    }
    .remove-btn:hover {
      background: #d32f2f;
    }
    .no-domains {
      font-size: 11px;
      color: #999;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h2>Katapult to Cloneable</h2>
  <p>Export models from Katapult Pro to Cloneable format.</p>
  <div class="status" id="status">
    Extension is ready
  </div>

  <div class="domains-section">
    <div class="section-title">Custom Domains</div>
    <button class="add-domain-btn" id="add-domain-btn">
      Add Current Domain
    </button>
    <div class="domain-list" id="domain-list">
      <!-- Domain list will be populated by JS -->
    </div>
  </div>

  <div class="debug-section">
    <button class="debug-btn" id="dump-websocket-btn" disabled>
      🔍 Download Raw WebSocket Data
    </button>
    <div style="font-size: 11px; color: #666; margin-top: 4px;">
      Debug: Export all captured WebSocket messages
    </div>
  </div>
  
  <script src="domain-manager.js"></script>
  <script src="popup.js"></script>
</body>
</html>
